version: "3.9"

services:
  fastapi_app:
    build: .
    container_name: fastapi_crud
    ports:
      - "8000:8000"
    volumes:
      # Mapea el código fuente (para desarrollo con hot reload si quieres)
      - .:/app
      # Mapea la base de datos SQLite para que no se borre al reiniciar
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

